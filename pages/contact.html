<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Niragi Kodagoda</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="../index.html" class="logo"><span>N</span>iragi</a>
            <div class="nav-links">
                <a href="../index.html">Home</a>
                <a href="about.html">About</a>
                <a href="skills.html">Skills</a>
                <a href="projects.html">Projects</a>
                <a href="certifications.html">Certifications</a>
                <a href="contact.html" class="active">Contact</a>
            </div>
            <button class="menu-btn"><i class="fas fa-bars"></i></button>
        </div>
    </nav>

    <div class="page-header">
        <div class="container">
            <h1>Contact Me</h1>
            <p>Let's work together</p>
        </div>
    </div>

    <section class="container">
        <div class="contact-grid">
            <div class="contact-info">
                <h3 style="margin-bottom: 2rem; color: var(--primary);">Get in Touch</h3>
                
                <div class="contact-detail">
                    <i class="fas fa-phone-alt"></i>
                    <div>
                        <h4>Phone</h4>
                        <p>+94 76 440 4505</p>
                    </div>
                </div>
                
                <div class="contact-detail">
                    <i class="fas fa-envelope"></i>
                    <div>
                        <h4>Email</h4>
                        <p>niragiaushadhini@gmail.com</p>
                    </div>
                </div>
                
                <div class="contact-detail">
                    <i class="fas fa-map-marker-alt"></i>
                    <div>
                        <h4>Location</h4>
                        <p>Marawila, Sri Lanka</p>
                    </div>
                </div>

                <div class="social-links" style="margin-top: 2rem;">
                    <a href="https://github.com/aushadhini" target="_blank"><i class="fab fa-github"></i></a>
                    <a href="https://www.linkedin.com/in/niragi-kodagoda-8b40b3288/" target="_blank"><i class="fab fa-linkedin"></i></a>
                    <a href="mailto:niragiaushadhini@gmail.com"><i class="fas fa-envelope"></i></a>
                </div>
            </div>

            <div class="contact-form">
                <h3 style="margin-bottom: 2rem; color: var(--primary);">Send a Message</h3>
                <form id="contactForm">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" class="form-control" id="name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" class="form-control" id="subject" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea class="form-control" id="message" rows="5" required></textarea>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
                </form>
            </div>
        </div>
    </section>

    <a href="#" id="backToTop" class="back-to-top"><i class="fas fa-arrow-up"></i></a>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">

                <div class="footer-links">
                    <a href="https://github.com/aushadhini" target="_blank"><i class="fab fa-github"></i></a>
                    <a href="https://www.linkedin.com/in/niragi-kodagoda-8b40b3288/" target="_blank"><i class="fab fa-linkedin"></i></a>
                    <a href="mailto:niragiaushadhini@gmail.com"><i class="fas fa-envelope"></i></a>
                </div>
            </div>
        </div>
    </footer>

    <script src="../js/main.js"></script>
</body>
</html>
